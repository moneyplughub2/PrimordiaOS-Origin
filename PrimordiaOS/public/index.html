<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimordiaOS - Live 3D Stream</title>
  <style>
    :root {
      --bg-color: #0b0d12;
      --card-bg: #131722;
      --accent: #00f0ff;
      --text: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .header {
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 2rem;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }
    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 5px;
    }
    .viewport-container {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    /* WebRTC Pixel Streaming Canvas Container */
    #unrealViewport {
      width: 100%;
      height: 700px;
      position: relative;
    }
    #unrealViewport iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Primordial Origin Universe</h1>
    <p>Live WebRTC Pixel Streaming Node</p>
  </div>

  <div class="viewport-container">
    <!-- WebRTC Pixel Streaming Canvas Container -->
    <div id="unrealViewport" style="width:100%; height:600px;">
      <iframe 
        src="http://127.0.0.1:8888" 
        style="width:100%; height:100%; border:none; border-radius:12px;"
        allow="autoplay; fullscreen; microphone; camera;">
      </iframe>
    </div>
  </div>
</body>
</html>
